global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "bettergov-node"
    metrics_path: "/bettergov/network/status"
    static_configs:
      - targets: ["bettergov-node:8545"]

  - job_name: "bettergov-backend"
    metrics_path: "/api/v1/health"
    static_configs:
      - targets: ["bettergov-backend:4000"]

